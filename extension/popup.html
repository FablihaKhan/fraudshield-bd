<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FraudShield BD</title>
<style>
  :root{--sky:#0EA5E9;--deep:#075985;--ink:#0B2545;--muted:#5B6B7F;--line:#DCEBF5;--high:#E07A6B;--verify:#E3A74F;--low:#46B394;--bg:#F0F9FF}
  *{box-sizing:border-box}
  body{margin:0;width:360px;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,"Noto Sans Bengali",sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#38BDF8,#0284C7);color:#fff}
  header img{width:30px;height:30px}header b{font-size:16px;display:block}header small{opacity:.9}
  header .sp{flex:1}
  .seg{display:flex;background:rgba(255,255,255,.22);border-radius:999px;padding:2px}
  .seg button{border:0;background:transparent;color:#fff;font:700 12px inherit;padding:4px 9px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--deep)}
  main{padding:12px 14px}
  .verdict{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;border:2px solid var(--line)}
  .dot{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 24px/1 sans-serif;flex:none}
  .v-high .dot{background:var(--high)}.v-verify .dot{background:var(--verify)}.v-low .dot{background:var(--low)}.v-off .dot{background:#94A3B8}
  .v-high{border-color:#F5C2BA}.v-verify{border-color:#F8D9A8}.v-low{border-color:#BFE8D8}
  .verdict b{font-size:16px;display:block}.verdict small{color:var(--muted)}
  .counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
  .counts div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
  .counts b{display:block;font-size:17px}.counts span{font-size:10.5px;color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:6px}
  .f{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
  .f.high{border-color:#F5C2BA}.f.medium{border-color:#F8D9A8}
  .f code,.xp code{font:11px Consolas,monospace;color:var(--muted)}
  .xp{margin-top:10px;background:#0B1B2F;color:#CFE8FF;border-radius:12px;padding:8px 10px;font:11.5px/1.5 Consolas,monospace;word-break:break-all}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{border:0;border-radius:999px;padding:7px 12px;font:700 12.5px inherit;cursor:pointer;background:#E0F2FE;color:var(--deep)}
  .toggle{display:flex;align-items:center;gap:8px;margin-left:auto;font-weight:700;font-size:12.5px}
  .toggle input{width:34px;height:18px;accent-color:var(--sky)}
  footer{padding:8px 14px 12px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;gap:2px}
  footer a{color:var(--deep)}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><div><b id="nm">FraudShield BD</b><small id="tg">Browser Shield</small></div><span class="sp"></span>
  <div class="seg" id="langSeg"><button data-lang="en">EN</button><button data-lang="bn">বাং</button></div></header>
<main>
  <div class="row" style="margin:0 0 10px"><div class="seg" id="lvlSeg" style="background:#DCEBF5"><button data-level="simple"></button><button data-level="expert"></button></div>
    <label class="toggle"><span id="onLbl"></span><input type="checkbox" id="onBox"></label></div>
  <div id="out"></div>
</main>
<footer><span id="ft"></span><span><span id="mk"></span> · <a href="https://fablihakhan.github.io/fraudshield-bd/" target="_blank" rel="noopener">fraudshield-bd</a></span></footer>
<script src="strings.js"></script>
<script src="popup.js"></script>
</body>
</html>
